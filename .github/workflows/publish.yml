name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Trusted publishing (OIDC) and provenance
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build
      - run: yarn test run
      - run: yarn test:integration
      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install --global npm@latest
      - run: npm publish --provenance --access public
