name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      # Yarn comes from the "packageManager" field of package.json, through Corepack
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint
      # Also runs type-check and api-extractor, which fails when the public API no longer matches etc/
      - run: yarn build
      - run: yarn test run
      # Runs dist against the jsonapi-ts version installed from npm
      - run: yarn test:integration

  package:
    name: Package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: npx --yes publint@0.3 --strict
      # Pure ESM package: require() is not supported on purpose
      - run: npx --yes @arethetypeswrong/cli@0.18 --pack . --profile esm-only
